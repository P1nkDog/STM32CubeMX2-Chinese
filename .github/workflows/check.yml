name: check

on:
  push:
    branches: ["master", "main"]
    paths:
      - "dict/localization.json"
      - "core/**"
      - "tools/**"
  pull_request:
    branches: ["master", "main"]

jobs:
  check-dict:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: |
          python -m py_compile main.py core\*.py tools\*.py

      - name: Dictionary structure check
        run: |
          python tools\check_dict.py
