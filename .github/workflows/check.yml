name: check

on:
  push:
    branches: ["master", "main"]
    paths:
      - "dict/localization.json"
      - "core/**"
      - "tools/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  check-dict:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m compileall -q main.py core tools

      - name: Dictionary structure check
        run: python tools\check_dict.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Install-root locate check
        run: python tools\test_locate.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Dictionary update path check
        run: python tools\test_update.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Terminology gate check
        run: python tools\check_glossary.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Terminology gate self-proof
        run: python tools\test_glossary.py
        env:
          PYTHONIOENCODING: utf-8
